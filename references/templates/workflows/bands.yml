# Control bands — copy to .github/workflows/bands.yml (bstack ≥ 0.41.0).
#
# Empirical (P11) rule 10: detection is deterministic, and the model acts only in tiers.
#   none / 1sigma (log) → the job summary only
#   2sigma (diagnose)   → intent.md + a diagnosis, opened as a PR
#   3sigma (propose)    → the same PR, labelled `propose`; any fix goes through review
# The PR is the triage queue. Merging it with `Status: accepted` accepts the intent.
# `insufficient_baseline` is reported as such and never read as healthy.
#
# The model returns text; a program writes the file. The diagnosis runs in a throwaway
# clone that holds no credentials, with Read/Grep/Glob only (no shell, no MCP servers).
# The workflow appends its reply to the intent. Only the PR step holds a token.
#
# The shipped metric is CI failure rate over this repo's workflow runs. Point BANDS_FILE
# at a different .control/bands/*.yaml and replace the series step for another metric.
name: Control bands

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  bands:
    runs-on: ${{ vars.AGENT_EVAL_RUNNER_LABELS && fromJSON(vars.AGENT_EVAL_RUNNER_LABELS) || 'self-hosted' }}
    timeout-minutes: 30
    env:
      BANDS_FILE: .control/bands/ci-failure-rate.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch bstack
        env:
          BSTACK_REF: v0.41.0
        run: git clone --quiet --depth 1 --branch "$BSTACK_REF" https://github.com/broomva/bstack.git "$RUNNER_TEMP/bstack"
      - name: Build the series (the complete days only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh run list --repo "$REPO" --limit 1000 --json conclusion,createdAt,status,name,url > "$RUNNER_TEMP/runs.json"
          python3 "$RUNNER_TEMP/bstack/scripts/bands.py" series ci-failure-rate --runs-json "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/series.json"
      - name: Check the band (deterministic, no model)
        id: check
        run: |
          python3 "$RUNNER_TEMP/bstack/scripts/bands.py" check "$BANDS_FILE" --series "$RUNNER_TEMP/series.json" --json > "$RUNNER_TEMP/result.json"
          tier=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tier"])' "$RUNNER_TEMP/result.json")
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          key=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["metric"] + "-" + d["tier"])' "$RUNNER_TEMP/result.json")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          { echo "### Control band: $tier"; echo '```json'; cat "$RUNNER_TEMP/result.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Is an intent PR already open for this metric and tier?
        id: open
        if: steps.check.outputs.tier == '2sigma' || steps.check.outputs.tier == '3sigma'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.check.outputs.key }}
        run: |
          n=$(gh pr list --state open --head "bands/$KEY" --json number -q 'length')
          if [ "${n:-0}" -gt 0 ]; then echo "open=true" >> "$GITHUB_OUTPUT"; echo "an intent PR for $KEY is already open"; else echo "open=false" >> "$GITHUB_OUTPUT"; fi
      - name: Write the intent, diagnose in a throwaway clone
        id: diag
        if: (steps.check.outputs.tier == '2sigma' || steps.check.outputs.tier == '3sigma') && steps.open.outputs.open == 'false'
        env:
          CLAUDE_BIN: ${{ vars.CLAUDE_BIN || 'claude' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          python3 "$RUNNER_TEMP/bstack/scripts/bands.py" intent "$BANDS_FILE" --result "$RUNNER_TEMP/result.json" --out-dir intent --json > "$RUNNER_TEMP/intent.json"
          read -r created file key < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(str(d.get("created", False)).lower(), d.get("path") or "-", d.get("dedupe_key") or "-")' "$RUNNER_TEMP/intent.json")
          { echo "created=$created"; echo "file=$file"; echo "key=$key"; } >> "$GITHUB_OUTPUT"
          [ "$created" = "true" ] || { echo "intent already exists: $file"; exit 0; }
          diag="$RUNNER_TEMP/diag"
          git clone --quiet --no-local . "$diag"
          mkdir -p "$diag/.bands"
          cp "$file" "$diag/.bands/intent.md"
          cp "$RUNNER_TEMP/runs.json" "$RUNNER_TEMP/result.json" "$diag/.bands/"
          bands_abs="$PWD/$BANDS_FILE"
          (cd "$diag" && python3 "$RUNNER_TEMP/bstack/scripts/bands.py" diagnose-cmd "$bands_abs" --intent .bands/intent.md --result "$RUNNER_TEMP/result.json") > "$RUNNER_TEMP/argv.json"
          python3 - "$RUNNER_TEMP/argv.json" "$CLAUDE_BIN" "$diag" "$file" "$GITHUB_OUTPUT" <<'PY'
          import json, subprocess, sys
          spec, claude, cwd, intent, gh_out = json.load(open(sys.argv[1])), sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
          if isinstance(spec, dict) and spec.get("skip"):
              raise SystemExit(0)
          argv = spec; argv[0] = claude
          out = subprocess.run(argv, cwd=cwd, capture_output=True, text=True, timeout=900, stdin=subprocess.DEVNULL)
          reply, failed = "", out.returncode != 0
          try:
              data = json.loads(out.stdout)
              reply, failed = data.get("result", ""), failed or bool(data.get("is_error"))
          except ValueError:
              reply, failed = out.stdout, True
          reply = reply.strip()
          if failed or not reply:
              reply = "## Diagnosis\n\n_diagnosis failed (exit %d): %s_" % (out.returncode, (reply or out.stderr.strip())[:300])
              open(gh_out, "a").write("diag_failed=1\n")
          elif not reply.startswith("## Diagnosis"):
              reply = "## Diagnosis\n\n" + reply
          with open(intent, "a") as f:
              f.write("\n<!-- model-written below (read-only diagnosis in a throwaway clone); detection above is deterministic -->\n" + reply + "\n")
          PY
      - name: Open the intent PR (one per metric and tier)
        if: steps.diag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ steps.check.outputs.tier }}
          FILE: ${{ steps.diag.outputs.file }}
          KEY: ${{ steps.diag.outputs.key }}
        run: |
          set -euo pipefail
          branch="bands/$KEY"
          git switch -C "$branch"
          git add "$FILE"
          git -c user.name="bands-detector" -c user.email="bands-detector@users.noreply.github.com" commit -q -m "intent: $(basename "$FILE" .md)"
          # One-shot helper: nothing is written to the runner's git config. The bot's branch can
          # outlive a merged or closed PR, so it is replaced, never merged into.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push -q --force origin "$branch"
          labels=(--label intent)
          [ "$TIER" = "3sigma" ] && labels+=(--label propose)
          gh pr create --head "$branch" --title "intent: $(basename "$FILE" .md)" \
            --body "Written by the control-band detector (deterministic). Tier: $TIER. Merge with Status: accepted to accept the intent; close to dismiss and tune the band." \
            "${labels[@]}" || gh pr create --head "$branch" --title "intent: $(basename "$FILE" .md)" --body "Tier: $TIER (labels unavailable)."
      - name: A failed diagnosis fails the job
        if: steps.diag.outputs.diag_failed == '1'
        run: |
          echo "::error::the diagnosis failed; the intent PR carries the failure text"
          exit 1
