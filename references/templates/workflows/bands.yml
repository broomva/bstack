# Control bands — copy to .github/workflows/bands.yml (bstack ≥ 0.41.0).
#
# Empirical (P11) rule 10: detection is deterministic, and the model acts only in tiers.
#   none / 1sigma (log) → the job summary only
#   2sigma (diagnose)   → intent.md + a READ-ONLY diagnosis, opened as a PR
#   3sigma (propose)    → the same PR, labelled `propose`; any fix goes through review
# The PR is the triage queue. Merging it with `Status: accepted` accepts the intent.
# `insufficient_baseline` is reported as such and never read as healthy.
#
# The shipped metric is CI failure rate over this repo's workflow runs. Point BANDS_FILE
# at a different .control/bands/*.yaml and replace the series step for another metric.
name: Control bands

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  bands:
    runs-on: ${{ vars.AGENT_EVAL_RUNNER_LABELS && fromJSON(vars.AGENT_EVAL_RUNNER_LABELS) || 'self-hosted' }}
    timeout-minutes: 30
    env:
      BANDS_FILE: .control/bands/ci-failure-rate.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Fetch bstack
        env:
          BSTACK_REF: v0.41.0
        run: git clone --quiet --depth 1 --branch "$BSTACK_REF" https://github.com/broomva/bstack.git "$RUNNER_TEMP/bstack"
      - name: Build the series
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh run list --repo "$REPO" --limit 1000 --json conclusion,createdAt,status > "$RUNNER_TEMP/runs.json"
          python3 "$RUNNER_TEMP/bstack/scripts/bands.py" series ci-failure-rate --runs-json "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/series.json"
      - name: Check the band (deterministic, no model)
        id: check
        run: |
          python3 "$RUNNER_TEMP/bstack/scripts/bands.py" check "$BANDS_FILE" --series "$RUNNER_TEMP/series.json" --json > "$RUNNER_TEMP/result.json"
          tier=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tier"])' "$RUNNER_TEMP/result.json")
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          { echo "### Control band: $tier"; echo '```json'; cat "$RUNNER_TEMP/result.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Write the intent and diagnose read-only (no token in this step)
        id: diag
        if: steps.check.outputs.tier == '2sigma' || steps.check.outputs.tier == '3sigma'
        env:
          CLAUDE_BIN: ${{ vars.CLAUDE_BIN || 'claude' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          python3 "$RUNNER_TEMP/bstack/scripts/bands.py" intent "$BANDS_FILE" --result "$RUNNER_TEMP/result.json" --out-dir intent --json > "$RUNNER_TEMP/intent.json"
          created=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("created", False)).lower())' "$RUNNER_TEMP/intent.json")
          file=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "$RUNNER_TEMP/intent.json")
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          # An intent that already exists (open PR, or merged earlier) is not diagnosed again.
          [ "$created" = "true" ] || { echo "intent already exists: $file"; exit 0; }
          python3 "$RUNNER_TEMP/bstack/scripts/bands.py" diagnose-cmd "$BANDS_FILE" --intent "$file" --result "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/argv.json"
          # Post-condition checked by a program the model cannot modify: after the diagnosis,
          # the deterministic intent text must be byte-identical and nothing else may change.
          cp "$file" "$RUNNER_TEMP/intent.before"
          python3 - "$RUNNER_TEMP/argv.json" "$CLAUDE_BIN" "$file" "$GITHUB_OUTPUT" <<'PY'
          import json, subprocess, sys
          spec = json.load(open(sys.argv[1]))
          if isinstance(spec, dict) and spec.get("skip"):
              raise SystemExit(0)
          argv = spec; argv[0] = sys.argv[2]
          out = subprocess.run(argv, capture_output=True, text=True, timeout=900, stdin=subprocess.DEVNULL)
          reply, failed = "", out.returncode != 0
          try:
              data = json.loads(out.stdout)
              reply, failed = data.get("result", ""), failed or bool(data.get("is_error"))
          except ValueError:
              reply, failed = out.stdout, True
          reply = reply.strip()
          if failed or not reply:
              reply = "## Diagnosis\n\n_diagnosis failed (exit %d): %s_" % (out.returncode, (reply or out.stderr.strip())[:300])
              open(sys.argv[4], "a").write("diag_failed=1\n")
          elif not reply.startswith("## Diagnosis"):  # the prompt asks for this heading; add it only if absent
              reply = "## Diagnosis\n\n" + reply
          with open(sys.argv[3], "a") as f:
              f.write("\n<!-- read-only, model-written below; detection above is deterministic -->\n" + reply + "\n")
          PY
          before_bytes=$(wc -c < "$RUNNER_TEMP/intent.before" | tr -d ' ')
          head -c "$before_bytes" "$file" | cmp -s - "$RUNNER_TEMP/intent.before" \
            || { echo "::error::the deterministic part of $file changed during the diagnosis"; exit 1; }
          changed=$(git status --porcelain --untracked-files=all | grep -v -F -- "$file" || true)
          [ -z "$changed" ] || { echo "::error::the diagnosis changed files outside the intent:"; echo "$changed"; exit 1; }
      - name: Open the intent PR
        if: steps.diag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ steps.check.outputs.tier }}
          FILE: ${{ steps.diag.outputs.file }}
        run: |
          set -euo pipefail
          name=$(basename "$FILE" .md)
          branch="bands/$name"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then echo "already open: $branch"; exit 0; fi
          git switch -c "$branch"
          git add "$FILE"
          git -c user.name="bands-detector" -c user.email="bands-detector@users.noreply.github.com" commit -q -m "intent: $name"
          git push -q origin "$branch"
          labels=(--label intent)
          [ "$TIER" = "3sigma" ] && labels+=(--label propose)
          gh pr create --head "$branch" --title "intent: $name" \
            --body "Written by the control-band detector (deterministic). Tier: $TIER. Merge with Status: accepted to accept the intent; close to dismiss and tune the band." \
            "${labels[@]}" || gh pr create --head "$branch" --title "intent: $name" --body "Tier: $TIER (labels unavailable)."
      - name: A failed diagnosis fails the job
        if: steps.diag.outputs.diag_failed == '1'
        run: |
          echo "::error::the read-only diagnosis failed; the intent PR carries the failure text"
          exit 1
