# leverage-setpoints.yaml — the reference signal r for the bstack self-improvement loop.
#
# scripts/leverage-sensor.py measures each metric from raw session transcripts
# (h ⟂ U — the agent cannot fake transcript structure), compares to these targets
# (e = r − h), and scripts/knowledge-wakeup-hook.sh injects the worst gap + its
# named actuator into the next SessionStart (the closure wire). doctor.sh §23
# reads the resulting .control/leverage-state.json to certify closure per RCS level.
#
# ── CAUSAL PRIORITY (read this before trusting the loop) ──────────────────────
# A reference the agent authored is endogenous: r = g(x) makes "converged" and
# "drifted" the same event (endogenous-reference-contamination). The targets below
# are bstack DEFAULTS — a starting point, not YOUR reference. Until a human edits
# these targets and sets `authored_by` to their name, the sensor + doctor report
# reference_authored: false and the loop is "closed but endogenous". Signing r0 is
# the one durable human act — do it before you rely on the loop's self-correction.
authored_by: bstack-default   # ← change to your name once you've reviewed the targets

version: 1
window_days: 7

# Metrics are tagged by RCS recursion level so closure is verified end-to-end:
#   L0 external plant (tool execution) · L1 agent internal (reflex loop) ·
#   L2 meta-control (knowledge/promotion feedback) · L3 governance.
# direction: lower_is_better → alert when value >= alert; higher_is_better → alert when value <= alert.
metrics:
  - id: m1
    name: continue_nudges_per_session
    level: L1
    direction: lower_is_better
    target: 0.30
    alert: 1.00
    actuator: "autonomous-loop limit-stall auto-resume + /goal (P19) — stop returning control mid-arc"
    why: "A user 'continue' nudge means the agent returned control it should have kept — the L1 reflex loop stalling."

  - id: m2
    name: tool_error_rate
    level: L0
    direction: lower_is_better
    target: 0.05
    alert: 0.12
    actuator: "triage the top error class each cycle; wire the specific PreToolUse guard"
    why: "Fraction of tool_results that errored — L0 plant faults. Rising rate = wasted turns + context."

  - id: m3
    name: read_before_edit_rate
    level: L0
    direction: lower_is_better
    target: 0.03
    alert: 0.10
    actuator: "PreToolUse Read-before-Edit guard hook (block Edit/Write on an unread path)"
    why: "Read-before-edit errors per Edit/Write/MultiEdit — a true rate. One guard removes the whole class."

  - id: m4
    name: permission_bypass_per_session
    level: L0
    direction: lower_is_better
    target: 0.50
    alert: 3.00
    actuator: "populate .claude/settings.json permissions.allow via fewer-permission-prompts"
    why: "Genuine dangerouslyDisableSandbox invocations — an empty allowlist forcing the agent to route around the sandbox."

  - id: m5
    name: kg_load_rate
    level: L2
    direction: higher_is_better
    target: 0.30
    alert: 0.10
    actuator: "if low, the knowledge substrate is written but not read — PRUNE production, do not add"
    why: "Fraction of sessions that consumed knowledge (kg/entity reads) — the L2 meta-control feedback channel. Makes further knowledge production conditional on consumption."

  - id: m6
    name: meta_work_session_ratio
    level: L3
    direction: lower_is_better
    target: 0.50
    alert: 0.75
    actuator: "anti-windup: freeze NEW governance/primitive edits (stops the numerator growing). The ONLY input that LOWERS m6 is MERGING an agent-authored PRODUCT PR (apps/core/work/…) — it is a trailing-window ratio, so expect a ~7d lag, not a one-PR clear. Waiting or a fresh session do nothing; only where you edit does."
    why: "Fraction of editing sessions that touched only meta paths vs any product path (sub-repos counted via absolute paths). THE anti-capture governor at L3 — the loop watching itself."

  # ── Context ledger — SHADOW (measured, NOT graded) ──────────────────────────
  # scripts/context_ledger.py measures what the context we inject costs and whether
  # it is used, and writes the full breakdown to leverage-state.json `context_ledger`
  # (bytes by source for main sessions and, separately, their subagents; pointer
  # follow-through; retrieval reflexes). These three rows are its headline values.
  # `status: shadow` keeps them out of grading, ranking and the actuator. They carry
  # no target, because no reference has been calibrated yet, and a shadow row with no
  # target is kept out of the SessionStart brief too: the agent being measured must
  # not read its own score. Author a target only after the ledger has run for a few
  # windows and the Layer-2 ablation says which way the numbers should move. doctor
  # §29 fails on a DEAD ledger (blind, partial, errored or all-null), never on a value.
  - id: cl1
    name: injected_bytes_per_session_p50
    level: L2
    status: shadow
    direction: lower_is_better
    why: "Median bytes of injected context per main session: hook output, CLAUDE.md/MEMORY.md and harness listings. Token cost ≈ bytes/4, an estimate. Per-turn figures are in the block; their median is mostly role-x."

  - id: cl2
    name: kg_pointer_follow_through_rate
    level: L2
    status: shadow
    direction: higher_is_better
    why: "Share of (session, KG entity) pointers an injection named that a later tool call in the same session opened. Opened, not used: persona/* entries carry their claim inline."

  - id: cl3
    name: retrieval_reflex_session_rate
    level: L2
    status: shadow
    direction: higher_is_better
    why: "Share of sessions that read the KG, docs/specs or memory, or ran deep research, from tool-call structure."

# Optional: override the knowledge-read path regex the sensor uses for m5.
# knowledge_paths: "research/entities|docs/knowledge-index|your/knowledge/dir"

# ── Exogenous ship-signal (BRO-1707) — SHADOW ───────────────────────────────
# leverage-ship-sensor.py re-bases the meta/product signal on MERGED PULL REQUESTS
# (unit = 1 per PR → no size-padding; fractional diff-path split → no single-file
# flip; agent-authored only → h ⟂ U) and writes .control/leverage-ship-state.json.
# leverage-sensor.py merges the result as `m6s_meta_work_ship_ratio` — a metric with
# NO setpoint here, so it is measured but NEVER graded/actuated (shadow). Once the
# CICD gates are ENFORCED (BRO-1709: branch protection + required checks + workflow
# attestation), promote it to an id `m6` setpoint and retire the session ratio.
ship_signal:
  shadow: true
  repos:              # allowlist — ONLY these are scanned; teammate/upstream repos
    - broomva/genesis        # (unrelated repos) are omitted → h ⟂ U
    - broomva/bstack
    - broomva/broomva.tech
  author_allowlist:   # count only the agent's own merged PRs, never a teammate's
    - broomva
  # product_paths / meta_paths default to the sensor's PRODUCT_EDIT_RE / META_EDIT_RE.
  tier_weights:
    green: 1.0        # all completed CI checks SUCCESS AND the PR did not modify its own .github/workflows
    ungated: 0.5      # red / no-CI / self-modified-gate — capped until BRO-1709 enforces branch protection
